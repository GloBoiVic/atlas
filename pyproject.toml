[project]
name = "atlas"
version = "0.1.0"
description = "Algorithmic trading platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.0,<27",
    "ccxt>=4.0,<5",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "httpx>=0.28,<1",
    "websockets>=14.0,<18",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<0.27",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
