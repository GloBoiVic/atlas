[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "httpx<1",
  "psycopg[binary]>=3,<4",
]

[project.scripts]
atlas-runtime = "backend.runtime.main:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pyright>=1,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
  "integration: requires a dedicated PostgreSQL test database",
  "external: opt-in credentialed external provider validation",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "backend/tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
